<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Find</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="header">
        <h1>Local Find</h1>
        <p id="endpoint-preview" class="endpoint-preview">http://HOST:8888</p>
      </header>

      <section class="device-card" aria-label="Current device">
        <div class="device-card-title">当前设备</div>
        <div class="device-grid">
          <span>Host</span>
          <strong id="device-host">未设置</strong>
          <span>Port</span>
          <strong id="device-port">8888</strong>
          <span>Token</span>
          <strong id="device-token-status">未保存</strong>
        </div>
        <p id="last-success" class="last-success">上次成功：暂无</p>
      </section>

      <section class="primary-controls" aria-label="Find phone">
        <button type="button" data-command="find-phone" class="find-phone-action">一键找手机</button>
        <button type="button" data-command="stop-all" class="primary-stop">停止全部</button>
      </section>

      <section class="protection-card" aria-label="Local protection lock">
        <div class="protection-header">
          <span>本地保护锁</span>
          <strong id="protection-status">未开启</strong>
        </div>
        <div class="pin-row">
          <input id="local-pin" name="local-pin" type="password" minlength="4" maxlength="12" inputmode="numeric" autocomplete="off" placeholder="设置 4-12 位 PIN">
          <button id="set-local-pin" type="button">设置本地保护 PIN</button>
        </div>
        <button id="disable-protection" type="button" class="text-action">关闭保护锁</button>
      </section>

      <section class="fields" aria-label="Connection settings">
        <label class="field">
          <span>Host</span>
          <input id="host" name="host" type="text" placeholder="192.168.1.108" autocomplete="off" spellcheck="false">
        </label>

        <label class="field">
          <span>Port</span>
          <input id="port" name="port" type="number" min="1" max="65535" inputmode="numeric" value="8888">
        </label>

        <label class="field">
          <span>Token</span>
          <input id="token" name="token" type="password" autocomplete="off" spellcheck="false">
        </label>

        <div class="token-options">
          <label class="remember-token">
            <input id="remember-token" name="remember-token" type="checkbox">
            <span>记住此电脑上的 Token</span>
          </label>
          <button id="clear-saved-token" type="button" class="text-action">清除已保存 Token</button>
        </div>
      </section>

      <section class="actions advanced-actions" aria-label="Advanced commands">
        <button type="button" data-command="status">检查状态</button>
        <button type="button" data-command="ring-stop">停止响铃</button>
        <button type="button" data-command="flash-start">开始闪光</button>
        <button type="button" data-command="flash-stop">停止闪光</button>
        <button type="button" data-command="diagnostics" class="secondary">打开诊断页</button>
      </section>

      <output id="result" class="result" role="status" aria-live="polite">未连接</output>
    </main>

    <div id="pin-modal" class="pin-modal hidden" role="dialog" aria-modal="true" aria-labelledby="pin-modal-title">
      <div class="pin-dialog">
        <h2 id="pin-modal-title">本地 PIN 验证</h2>
        <p id="pin-modal-message">请输入本地保护 PIN。</p>
        <input id="verify-pin" type="password" minlength="4" maxlength="12" inputmode="numeric" autocomplete="off">
        <div class="pin-actions">
          <button id="confirm-pin" type="button">验证</button>
          <button id="cancel-pin" type="button" class="secondary-action">取消</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
