<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Find</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="header">
        <h1>Local Find</h1>
        <p id="endpoint-preview" class="endpoint-preview">http://HOST:8888</p>
      </header>

      <section class="fields" aria-label="Connection settings">
        <label class="field">
          <span>Host</span>
          <input id="host" name="host" type="text" placeholder="192.168.1.108" autocomplete="off" spellcheck="false">
        </label>

        <label class="field">
          <span>Port</span>
          <input id="port" name="port" type="number" min="1" max="65535" inputmode="numeric" value="8888">
        </label>

        <label class="field">
          <span>Token</span>
          <input id="token" name="token" type="password" autocomplete="off" spellcheck="false">
        </label>

        <div class="token-options">
          <label class="remember-token">
            <input id="remember-token" name="remember-token" type="checkbox">
            <span>记住此电脑上的 Token</span>
          </label>
          <button id="clear-saved-token" type="button" class="text-action">清除已保存 Token</button>
        </div>
      </section>

      <section class="actions" aria-label="Commands">
        <button type="button" data-command="status">检查状态</button>
        <button type="button" data-command="ring-start" class="primary-action">开始响铃</button>
        <button type="button" data-command="ring-stop">停止响铃</button>
        <button type="button" data-command="flash-start">开始闪光</button>
        <button type="button" data-command="flash-stop">停止闪光</button>
        <button type="button" data-command="stop-all" class="danger primary-stop">停止全部</button>
        <button type="button" data-command="diagnostics" class="secondary">打开诊断页</button>
      </section>

      <output id="result" class="result" role="status" aria-live="polite">未连接</output>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
